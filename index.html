<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pagoda Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #dfebf5; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #333;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 0;
        }

        /* UI Overlay for Gemini Features */
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 90%;
            max-width: 600px;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .response-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 12px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #2c3e50;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            min-height: 40px;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.6;
        }

        .response-box.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .controls {
            pointer-events: auto;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 12px 24px;
            border-radius: 30px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            color: #e74c3c; /* Sakura red on hover */
        }

        button:active {
            transform: translateY(0);
        }
        
        .loading-dots::after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>
    <div id="loading">Generating Scene...</div>

    <!-- Gemini UI Overlay --><div id="ui-container">
        <div id="response-area" class="response-box">
            <!-- Gemini text or image appears here --></div>
        <div class="controls">
            <button onclick="generateHaiku()">✨ Compose Haiku</button>
            <button onclick="generateWisdom()">✨ Zen Wisdom</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Gemini API Integration ---
        const apiKey = ""; // Provided by runtime environment

        async function callGemini(prompt) {
            // Implement exponential backoff for retries
            const maxRetries = 3;
            let currentRetry = 0;

            while (currentRetry < maxRetries) {
                const responseArea = document.getElementById('response-area');
                responseArea.innerHTML = 'Thinking<span class="loading-dots"></span>';
                responseArea.classList.add('visible');
                
                // Disable buttons during generation
                document.querySelectorAll('.controls button').forEach(btn => btn.disabled = true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    if (!response.ok) {
                        if (response.status === 429) { // Too Many Requests
                            const delay = Math.pow(2, currentRetry) * 1000 + Math.random() * 1000;
                            currentRetry++;
                            if (currentRetry < maxRetries) {
                                await new Promise(resolve => setTimeout(resolve, delay));
                                continue; 
                            }
                        }
                        throw new Error(`API Error: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    
                    // Replace newlines with breaks for display
                    responseArea.innerHTML = text.replace(/\n/g, '<br>');
                    return; // Success
                } catch (error) {
                    console.error("Gemini API Error:", error);
                    currentRetry++;
                } finally {
                    // Re-enable buttons after attempt (success or failure)
                    document.querySelectorAll('.controls button').forEach(btn => btn.disabled = false);
                }
            }
            
            // If all retries fail
            const responseArea = document.getElementById('response-area');
            responseArea.innerText = "The wind is too loud to hear the spirits right now. (Connection Error)";
        }

        function generateHaiku() {
            callGemini("Write a beautiful, traditional haiku about a red pagoda surrounded by falling cherry blossom petals in spring. Capture the feeling of peace, stillness, and transience. Do not include a title.");
        }

        function generateWisdom() {
            callGemini("You are a wise, ancient spirit living in this pagoda. Give me a short, profound piece of zen wisdom about life, nature, or finding peace. Keep it under two sentences. Tone: mystical and calming.");
        }

        // --- Three.js Scene Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xdfebf5, 0.02);
        scene.background = new THREE.Color(0xdfebf5);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(18, 12, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // BOOSTED intensity for better shadows and contrast
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); 
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 500;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        // --- Materials ---
        const redMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.7 });
        const darkRoofMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.9 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.8 });
        
        // Sharper gold look
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.1 });
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 1.0 });
        
        // Shoji paper glow material
        const windowMat = new THREE.MeshStandardMaterial({
            color: 0xFFFFE0, // Pale yellow/white
            emissive: 0xFFFFE0, // Emits light
            emissiveIntensity: 0.3, // Brightness for the paper glow
            roughness: 1.0, 
            metalness: 0.0,
        });
        
        // Material for the stone path
        const pathMat = new THREE.MeshStandardMaterial({ color: 0x9e7b6d, roughness: 1.0 }); 

        
        // --- Ground ---
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x7C9473, roughness: 1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Helper for Curved Roof ---
        // Creates a "swooped" roof by stacking cone segments
        function createCurvedRoof(width, height) {
            const group = new THREE.Group();
            const steps = 4; // How many segments to smooth the curve
            const stepHeight = height / steps;
            
            let currentY = 0;
            let currentWidth = width;
            
            for(let i=0; i<steps; i++) {
                // Make the curve exponential-ish for that Japanese style
                const nextWidth = width * (1 - ((i + 1) / steps) * 0.85); 
                
                // Using 4 segments for that square japanese roof look, rotated 45 deg
                const geometry = new THREE.CylinderGeometry(nextWidth / 1.414, currentWidth / 1.414, stepHeight, 4);
                const mesh = new THREE.Mesh(geometry, darkRoofMat);
                mesh.position.y = currentY + stepHeight/2;
                mesh.rotation.y = Math.PI / 4;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);

                currentY += stepHeight;
                currentWidth = nextWidth;
            }
            return group;
        }

        // --- Pagoda Builder Function ---
        function createPagoda(x, z) {
            const pagodaGroup = new THREE.Group();
            pagodaGroup.position.set(x, 0, z);

            // Base Platform
            const baseGeo = new THREE.BoxGeometry(14, 0.8, 14);
            const base = new THREE.Mesh(baseGeo, stoneMat);
            base.position.y = 0.4;
            base.receiveShadow = true;
            base.castShadow = true;
            pagodaGroup.add(base);

            const baseGeo2 = new THREE.BoxGeometry(12, 0.6, 12);
            const base2 = new THREE.Mesh(baseGeo2, stoneMat);
            base2.position.y = 1.1;
            base2.receiveShadow = true;
            base2.castShadow = true;
            pagodaGroup.add(base2);

            let currentY = 1.4;
            const levels = 3;
            let size = 10;

            for(let i = 0; i < levels; i++) {
                const levelHeight = 2.5; // Slightly more compact
                
                // 1. Walls (Core)
                const coreWidth = size * 0.55;
                const coreGeo = new THREE.BoxGeometry(coreWidth, levelHeight, coreWidth);
                const core = new THREE.Mesh(coreGeo, redMat);
                core.position.y = currentY + levelHeight / 2;
                core.castShadow = true;
                core.receiveShadow = true;
                pagodaGroup.add(core);

                // 2. Corner Pillars
                const pillarWidth = 0.4;
                const pillarGeo = new THREE.BoxGeometry(pillarWidth, levelHeight, pillarWidth);
                const pDist = coreWidth / 2 + 0.05;
                
                const pillarsPos = [
                    [pDist, pDist], [-pDist, pDist], [pDist, -pDist], [-pDist, -pDist]
                ];

                pillarsPos.forEach(pos => {
                    const p = new THREE.Mesh(pillarGeo, redMat);
                    p.position.set(pos[0], currentY + levelHeight/2, pos[1]);
                    p.receiveShadow = true;
                    p.castShadow = true;
                    pagodaGroup.add(p);
                });

                // 3. Windows (Low Poly Shoji Style)
                for(let side=0; side<4; side++) {
                    // Skip front window on Level 0 (Door is there)
                    if (i === 0 && side === 0) continue;

                    const winGroup = new THREE.Group();
                    
                    const winWidth = coreWidth * 0.5;
                    const winHeight = levelHeight * 0.5;
                    const winGeo = new THREE.BoxGeometry(winWidth, winHeight, 0.1);
                    const barGeo = new THREE.BoxGeometry(winWidth, 0.15, 0.15); // Horizontal bar
                    const vBarGeo = new THREE.BoxGeometry(0.15, winHeight, 0.15); // Vertical bar
                    
                    // Glass/Paper
                    const win = new THREE.Mesh(winGeo, windowMat);
                    winGroup.add(win);

                    // Crossbars for detail
                    const hBar = new THREE.Mesh(barGeo, woodMat);
                    winGroup.add(hBar);
                    const vBar = new THREE.Mesh(vBarGeo, woodMat);
                    winGroup.add(vBar);

                    // Positioning logic
                    // Tucked slightly inside the wall
                    const offset = coreWidth/2 - 0.02; 
                    const yPos = currentY + levelHeight/2;

                    if (side === 0) { // Front
                        winGroup.position.set(0, yPos, offset);
                    } else if (side === 1) { // Right
                        winGroup.position.set(offset, yPos, 0);
                        winGroup.rotation.y = Math.PI / 2;
                    } else if (side === 2) { // Back
                        winGroup.position.set(0, yPos, -offset);
                        winGroup.rotation.y = Math.PI;
                    } else if (side === 3) { // Left
                        winGroup.position.set(-offset, yPos, 0);
                        winGroup.rotation.y = -Math.PI / 2;
                    }
                    
                    pagodaGroup.add(winGroup);
                }

                // 4. Railing/Balcony
                const balconyWidth = size * 0.8;
                const balconyGeo = new THREE.BoxGeometry(balconyWidth, 0.2, balconyWidth);
                const balcony = new THREE.Mesh(balconyGeo, woodMat);
                balcony.position.y = currentY;
                balcony.receiveShadow = true;
                pagodaGroup.add(balcony);
                
                // Add little railings on top of balcony
                if (i > 0) {
                    const railHeight = 0.6;
                    const rThick = 0.1;
                    const rGeoH = new THREE.BoxGeometry(balconyWidth, 0.1, rThick);
                    const rGeoV = new THREE.BoxGeometry(rThick, 0.1, balconyWidth);
                    
                    const r1 = new THREE.Mesh(rGeoH, redMat); r1.position.set(0, currentY + railHeight, balconyWidth/2 - rThick/2);
                    const r2 = new THREE.Mesh(rGeoH, redMat); r2.position.set(0, currentY + railHeight, -balconyWidth/2 + rThick/2);
                    const r3 = new THREE.Mesh(rGeoV, redMat); r3.position.set(balconyWidth/2 - rThick/2, currentY + railHeight, 0);
                    const r4 = new THREE.Mesh(rGeoV, redMat); r4.position.set(-balconyWidth/2 + rThick/2, currentY + railHeight, 0);
                    
                    pagodaGroup.add(r1, r2, r3, r4);
                }


                // 5. Door (Only on Level 1)
                if(i === 0) {
                    const doorGeo = new THREE.BoxGeometry(1.5, 2.0, 0.2);
                    const doorFrame = new THREE.Mesh(doorGeo, woodMat);
                    doorFrame.position.set(0, currentY + 1.0, coreWidth/2 + 0.1);
                    pagodaGroup.add(doorFrame);
                }

                // 6. Roof (New "Swooped" Look)
                const roofWidth = size * 1.3;
                const roofHeight = 1.8; // A bit taller to show curve
                
                const curvedRoof = createCurvedRoof(roofWidth, roofHeight);
                // Position it on top
                curvedRoof.position.y = currentY + levelHeight;
                pagodaGroup.add(curvedRoof);

                currentY += levelHeight + 0.8; // Spacing for next level
                size *= 0.75; // Taper faster
            }

            // Spire
            const spireBaseGeo = new THREE.BoxGeometry(1, 0.5, 1);
            const spireBase = new THREE.Mesh(spireBaseGeo, darkRoofMat);
            spireBase.position.y = currentY;
            pagodaGroup.add(spireBase);

            const spireGeo = new THREE.CylinderGeometry(0.05, 0.3, 3, 8);
            const spire = new THREE.Mesh(spireGeo, goldMat);
            spire.position.y = currentY + 1.5;
            pagodaGroup.add(spire);

            scene.add(pagodaGroup);
        }

        createPagoda(0, 0);
        
        // --- Path Builder Function ---
        function createPaths() {
            const pathGroup = new THREE.Group();
            // Path segments should be slightly above the ground (0.01) to prevent z-fighting
            const pathHeight = 0.01; 
            
            // Path 1: Straight approach (from south towards pagoda, leads directly to the door)
            const segmentGeo = new THREE.PlaneGeometry(3, 3);
            const numSegments = 6;
            
            for (let i = 0; i < numSegments; i++) {
                const segment = new THREE.Mesh(segmentGeo, pathMat);
                // Positioned along the Z axis leading to the Pagoda (at Z=0). Starts at Z=18.
                segment.position.set(0, pathHeight, 18 - (i * 3) - 1.5); 
                segment.rotation.x = -Math.PI / 2;
                segment.receiveShadow = true;
                pathGroup.add(segment);
            }
            
            scene.add(pathGroup);
        }

        createPaths();

        // --- Cherry Blossom Trees (Sakura) ---
        function createTree(x, z, scale = 1) {
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);
            treeGroup.scale.set(scale, scale, scale);

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 4, 6);
            const trunk = new THREE.Mesh(trunkGeo, woodMat);
            trunk.position.y = 2;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            treeGroup.add(trunk);

            // Leaves (Cloud of pink spheres)
            const leaveMat = new THREE.MeshStandardMaterial({ color: 0xffb7c5, flatShading: true });
            
            const positions = [
                {x:0, y:4, z:0, s: 2.5},
                {x:1, y:5, z:1, s: 2},
                {x:-1, y:4.5, z:-1, s: 2},
                {x:1, y:4.2, z:-0.5, s: 1.8},
                {x:-0.5, y:5.2, z:1, s: 1.5},
            ];

            positions.forEach(pos => {
                const geo = new THREE.DodecahedronGeometry(pos.s);
                const mesh = new THREE.Mesh(geo, leaveMat);
                mesh.position.set(pos.x, pos.y, pos.z);
                mesh.castShadow = true;
                treeGroup.add(mesh);
            });

            scene.add(treeGroup);
        }

        // Scatter more trees (11 total now)
        const treePositions = [
            [15, 10], [-12, 15], [12, -12], [-15, -10],
            [25, 5], [-20, 8], [8, 22], [-5, -20],
            [30, 0], [0, 25], [-25, -25] 
        ];
        
        treePositions.forEach(pos => {
            const scale = 0.8 + Math.random() * 0.5;
            createTree(pos[0], pos[1], scale);
        });

        // --- Falling Petals Particle System ---
        const petalCount = 1000;
        const petalGeo = new THREE.BufferGeometry();
        const petalPositions = [];
        const petalVelocities = [];

        for(let i=0; i<petalCount; i++) {
            petalPositions.push(
                (Math.random() - 0.5) * 60,
                Math.random() * 30,
                (Math.random() - 0.5) * 60
            );
            petalVelocities.push(
                (Math.random() - 0.5) * 0.05, // x
                - (0.02 + Math.random() * 0.05), // y (falling)
                (Math.random() - 0.5) * 0.05 // z
            );
        }

        petalGeo.setAttribute('position', new THREE.Float32BufferAttribute(petalPositions, 3));
        const petalMat = new THREE.PointsMaterial({
            color: 0xffc0cb,
            size: 0.3,
            transparent: true,
            opacity: 0.8
        });
        const particleSystem = new THREE.Points(petalGeo, petalMat);
        scene.add(particleSystem);


        // --- Animation Loop ---
        const loading = document.getElementById('loading');
        let loaded = false;

        function animate() {
            requestAnimationFrame(animate);

            if(!loaded) {
                loading.style.opacity = 0;
                loaded = true;
            }

            controls.update();

            // Animate particles
            const positions = particleSystem.geometry.attributes.position.array;
            for(let i=0; i < petalCount; i++) {
                const yIdx = i * 3 + 1;
                
                // Update Y
                positions[yIdx] += petalVelocities[i * 3 + 1];
                
                // Update X and Z drift
                positions[i * 3] += Math.sin(Date.now() * 0.001 + i) * 0.01;
                positions[i * 3 + 2] += Math.cos(Date.now() * 0.001 + i) * 0.01;

                // Reset if below ground
                if(positions[yIdx] < 0) {
                    positions[yIdx] = 30;
                    positions[i*3] = (Math.random() - 0.5) * 60;
                    positions[i*3+2] = (Math.random() - 0.5) * 60;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the animation loop when the script runs
        animate();

    </script>
</body>
</html>
